<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>카마이타치의 밤 2 · PS2</title>
<link rel="stylesheet" href="player.css">
<main>
  <section id="screen" aria-label="카마이타치의 밤 2">
    <video playsinline preload="auto" id="movie"></video>
    <canvas width="640" height="448" tabindex="0" aria-label="게임 화면"></canvas>
    <button type="button" id="menu-button" aria-label="게임 메뉴" title="게임 메뉴" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" class="open"><rect x="3" y="3.5" width="7" height="5" rx="1"/><rect x="14" y="9.5" width="7" height="5" rx="1"/><rect x="3" y="15.5" width="7" height="5" rx="1"/><path d="M10 6h2v12h-2M12 12h2"/></svg>
      <svg viewBox="0 0 24 24" aria-hidden="true" class="back"><path d="M9 5L4 10l5 5M4 10h10a5 5 0 0 1 0 10h-3"/></svg>
    </button>
    <div id="game-menu" hidden>
      <button type="button" data-menu="resume">계속하기</button>
      <button type="button" data-menu="fullscreen">전체 화면</button>
      <button type="button" data-menu="title">타이틀로</button>
    </div>
    <div id="loading">불러오는 중…</div>
  </section>
  <p class="sr" id="status" aria-live="polite"></p>
</main>
<script type="module" src="player.js"></script>
</html>
