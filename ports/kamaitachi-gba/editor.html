<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>세로 화면 배경 편집</title>
<style>
  :root { --bg: #0e0f12; --panel: #17191e; --line: #2a2d35; --text: #ece8df; --dim: #9a968d; --accent: #d2493c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Noto Sans KR", sans-serif; }
  body { display: grid; grid-template-columns: minmax(260px, 1fr) auto 300px; gap: 16px; padding: 16px; height: 100vh; }
  .list { display: flex; flex-direction: column; min-height: 0; }
  .filters { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .filters button, .modes button, .actions button { border: 0; border-radius: 8px; padding: 7px 12px; background: var(--panel); color: var(--text); cursor: pointer; font: inherit; }
  .filters button[aria-pressed="true"], .modes button[aria-pressed="true"] { background: var(--accent); }
  .modes button:disabled { opacity: .35; cursor: not-allowed; }
  .grid { overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); gap: 8px; align-content: start; grid-auto-rows: max-content; padding-right: 4px; }
  .pic { position: relative; aspect-ratio: 3 / 2; border: 0; padding: 0; background: #000; border-radius: 6px; overflow: hidden; cursor: pointer; outline: 2px solid transparent; }
  .pic img { display: block; width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
  .pic span { position: absolute; left: 4px; top: 4px; padding: 0 5px; border-radius: 4px; background: rgba(0,0,0,.7); font-size: 12px; }
  .pic .tags { left: auto; right: 4px; }
  .pic[aria-current="true"] { outline-color: var(--accent); }
  .phone { width: 390px; height: calc(100vh - 32px); max-height: 756px; /* the picture area of a phone in the hub page (about 0.57 wide to tall, 태우's iPhone) */ border-radius: 22px; overflow: hidden; background: #000; box-shadow: 0 0 0 6px #222; align-self: start; }
  .phone iframe { width: 390px; height: 100%; border: 0; display: block; }
  .side { display: flex; flex-direction: column; gap: 18px; }
  .side h1 { font-size: 18px; margin: 0; }
  .side h2 { font-size: 13px; color: var(--dim); font-weight: 500; margin: 0 0 6px; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row input[type=range] { flex: 1; accent-color: var(--accent); }
  .row output { width: 40px; text-align: right; color: var(--dim); }
  .hint { color: var(--dim); font-size: 12px; margin: 4px 0 0; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .actions .save { background: var(--accent); }
  #status { color: var(--dim); min-height: 1.5em; }
  .cands { display: flex; gap: 6px; flex-wrap: wrap; }
  .cands button { border: 0; padding: 0; border-radius: 6px; overflow: hidden; background: var(--panel); color: var(--text); cursor: pointer; outline: 2px solid transparent; width: 64px; font: inherit; }
  .cands button img { display: block; width: 64px; height: 96px; object-fit: cover; }
  .cands button span { display: block; font-size: 12px; padding: 2px 0; text-align: center; }
  .cands button[aria-pressed="true"] { outline-color: var(--accent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<section class="list">
  <div class="filters" id="filters">
    <button data-filter="all" aria-pressed="true">전체</button>
    <button data-filter="edited" aria-pressed="false">편집함</button>
  </div>
  <div class="grid" id="grid"></div>
</section>
<div class="phone"><iframe id="preview" title="휴대폰 미리보기" src="index.html?reader=1&amp;bigtext=1&amp;preview=1"></iframe></div>
<section class="side">
  <h1 id="title">그림을 고르세요</h1>
  <div>
    <h2>표시 방식</h2>
    <div class="modes" id="modes">
      <button data-mode="">기본 (원본 + 흐린 배경)</button>
      <button data-mode="fill">꽉 채워 자르기</button>
    </div>
    <p class="hint">기본은 원본 + 흐린 배경, 확대 120%, 좌우 가운데예요.</p>
  </div>
  <div id="candBox" hidden>
    <h2>AI 확장 후보</h2>
    <div class="cands" id="cands"></div>
  </div>
  <div id="shiftBox">
    <h2>위아래 위치</h2>
    <div class="row"><input type="range" id="shift" min="-100" max="100" step="1" value="0"><output id="shiftOut">0</output></div>
    <p class="hint">오른쪽으로 갈수록 그림이 아래로 내려가요.</p>
  </div>
  <div>
    <h2>확대</h2>
    <div class="row"><input type="range" id="zoom" min="100" max="300" step="5" value="100"><output id="zoomOut">100%</output></div>
  </div>
  <div id="cropBox">
    <h2>좌우 위치 (0 왼쪽 끝, 100 오른쪽 끝)</h2>
    <div class="row"><label><input type="checkbox" id="cropAuto" checked> 기본 (가운데)</label></div>
    <div class="row"><input type="range" id="crop" min="0" max="100" step="1" value="50" disabled><output id="cropOut">자동</output></div>
  </div>
  <div class="actions">
    <button id="prev">← 이전</button>
    <button id="next">다음 →</button>
    <button id="reset">이 그림 초기화</button>
    <button id="save" class="save">저장</button>
  </div>
  <p id="status"></p>
</section>
<script type="module">
const $ = (id) => document.getElementById(id);
const IDS = Array.from({ length: 298 }, (_, i) => i);
const pad = (id) => String(id).padStart(3, "0");
let edits = {}, ai = new Set(), current = null, filter = "all", dirty = false, shownId = null;

const [savedEdits, aiIds, candidateList] = await Promise.all([
  fetch("/art/portrait-edits.json", { cache: "no-cache" }).then((r) => (r.ok ? r.json() : {})).catch(() => ({})),
  fetch("/art/outpaint/index.json").then((r) => (r.ok ? r.json() : [])).catch(() => []),
  fetch("/art/outpaint/candidates.json", { cache: "no-cache" }).then((r) => (r.ok ? r.json() : {})).catch(() => ({})),
]);
const candidates = candidateList ?? {};
edits = savedEdits ?? {};
ai = new Set(aiIds);

function tags(id) {
  return [edits[id] ? "편집" : ""].filter(Boolean).join(" · ");
}
function renderGrid() {
  const grid = $("grid");
  grid.replaceChildren(...IDS.filter((id) => filter === "all" || (filter === "ai" ? ai.has(id) : edits[id])).map((id) => {
    const button = document.createElement("button");
    button.className = "pic";
    button.dataset.id = id;
    button.setAttribute("aria-current", String(id === current));
    button.innerHTML = `<img loading="lazy" alt="" src="/kamaitachi-gba-kor/assets/bg/${pad(id)}.png"><span>${pad(id)}</span>${tags(id) ? `<span class="tags">${tags(id)}</span>` : ""}`;
    button.addEventListener("click", () => select(id));
    return button;
  }));
}
function syncControls() {
  const edit = edits[current] ?? {};
  $("title").textContent = current === null ? "그림을 고르세요" : `그림 ${pad(current)}`;
  for (const button of $("modes").children) {
    button.setAttribute("aria-pressed", String((edit.mode === "fill" ? "fill" : "") === button.dataset.mode));
    button.disabled = button.dataset.mode === "ai" && !ai.has(current);
  }
  const mode = edit.mode === "fill" ? "fill" : "frame";
  $("shiftBox").hidden = mode === "fill";
  const picks = candidates[current] ?? [];
  $("candBox").hidden = true; // AI-extended candidates are given up (2026-11-26)
  $("cands").replaceChildren(...["", ...picks].map((pick) => {
    const button = document.createElement("button");
    button.dataset.pick = pick;
    button.setAttribute("aria-pressed", String((edit.candidate ?? "") === pick));
    const src = pick ? `/art/outpaint/cand/${pad(current)}-${pick}.png` : `/art/outpaint/${pad(current)}.png`;
    button.innerHTML = `<img alt="" src="${src}"><span>${pick ? pick.toUpperCase() : "지금 것"}</span>`;
    return button;
  }));
  $("zoom").value = Math.round((edit.zoom ?? 1.2) * 100);
  $("zoomOut").textContent = `${Math.round((edit.zoom ?? 1.2) * 100)}%`;
  $("shift").value = edit.shift ?? 0;
  $("shiftOut").textContent = edit.shift ?? 0;
  const auto = !Number.isFinite(edit.crop);
  $("cropAuto").checked = auto;
  $("crop").disabled = auto;
  if (!auto) $("crop").value = edit.crop;
  $("cropOut").textContent = auto ? "50" : edit.crop;
}
// The preview player answers once it has the picture on screen; until then the message is repeated
// (the player may still be loading).
let sendTimer = 0;
function send() {
  clearTimeout(sendTimer);
  if (current === null) return;
  $("preview").contentWindow?.postMessage({ type: "preview", id: current, edit: edits[current] ?? null }, location.origin);
  if (shownId !== current) sendTimer = setTimeout(send, 500);
}
addEventListener("message", (event) => {
  if (event.origin !== location.origin) return;
  if (event.data?.type === "preview-shown") shownId = event.data.id;
  if (event.data?.type === "preview-ready") send();
});
function select(id) {
  current = id;
  shownId = null;
  for (const button of $("grid").children) button.setAttribute("aria-current", String(Number(button.dataset.id) === id));
  $("grid").querySelector(`[data-id="${id}"]`)?.scrollIntoView({ block: "nearest" });
  syncControls();
  send();
}
function change(patch) {
  if (current === null) return;
  const edit = { ...(edits[current] ?? {}), ...patch };
  for (const key of Object.keys(edit)) if (edit[key] === undefined || edit[key] === "" || edit[key] === null) delete edit[key];
  if (edit.shift === 0) delete edit.shift;
  if (edit.zoom === 1.2) delete edit.zoom;
  if (Object.keys(edit).length) edits[current] = edit; else delete edits[current];
  dirty = true;
  $("status").textContent = "저장하지 않은 변경이 있어요.";
  syncControls();
  send();
  const tile = $("grid").querySelector(`[data-id="${current}"]`);
  if (tile) {
    tile.querySelector(".tags")?.remove();
    if (tags(current)) tile.insertAdjacentHTML("beforeend", `<span class="tags">${tags(current)}</span>`);
  }
}
$("modes").addEventListener("click", (event) => {
  const mode = event.target.closest("button")?.dataset.mode;
  if (mode !== undefined) change({ mode: mode || undefined });
});
$("cands").addEventListener("click", (event) => {
  const pick = event.target.closest("button")?.dataset.pick;
  if (pick !== undefined) change({ candidate: pick || undefined });
});
$("zoom").addEventListener("input", () => change({ zoom: Number($("zoom").value) / 100 }));
$("shift").addEventListener("input", () => change({ shift: Number($("shift").value) }));
$("cropAuto").addEventListener("change", () => change({ crop: $("cropAuto").checked ? undefined : Number($("crop").value) }));
$("crop").addEventListener("input", () => change({ crop: Number($("crop").value) }));
$("reset").addEventListener("click", () => { if (current !== null) { delete edits[current]; change({}); } });
const visible = () => [...$("grid").children].map((b) => Number(b.dataset.id));
const step = (delta) => {
  const list = visible();
  if (!list.length) return;
  const at = list.indexOf(current);
  select(list[Math.max(0, Math.min(list.length - 1, at < 0 ? 0 : at + delta))]);
};
$("prev").addEventListener("click", () => step(-1));
$("next").addEventListener("click", () => step(1));
addEventListener("keydown", (event) => {
  if (event.target.matches("input")) return;
  if (event.key === "ArrowLeft") step(-1);
  if (event.key === "ArrowRight") step(1);
});
$("save").addEventListener("click", async () => {
  $("status").textContent = "저장 중…";
  try {
    const response = await fetch("/edit/portrait-edits.json", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(edits) });
    if (!response.ok) throw new Error(response.status === 403 ? "이 PC에서만 저장할 수 있어요." : `저장 실패 (${response.status})`);
    dirty = false;
    $("status").textContent = `저장했어요. 편집한 그림 ${Object.keys(edits).length}장. 게임을 새로고침하면 반영돼요.`;
  } catch (error) {
    $("status").textContent = error.message;
  }
});
addEventListener("beforeunload", (event) => { if (dirty) event.preventDefault(); });
$("filters").addEventListener("click", (event) => {
  const value = event.target.closest("button")?.dataset.filter;
  if (!value) return;
  filter = value;
  for (const button of $("filters").children) button.setAttribute("aria-pressed", String(button.dataset.filter === filter));
  renderGrid();
});
renderGrid();
select(ai.size ? [...ai].sort((a, b) => a - b)[0] : 0);
</script>
</body>
</html>
