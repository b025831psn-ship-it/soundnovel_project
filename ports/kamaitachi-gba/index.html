<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>카마이타치의 밤 어드밴스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+JP:wght@400;600&display=swap">
<link rel="stylesheet" href="shell.css">
</head>
<body>
<main class="shell" id="shell">
  <!-- The cartridge's 240x160 screen, scaled by whole numbers. The game's pixels are never drawn over;
       the only thing laid on top is the menu button, an HTML element in the bottom-right corner. -->
  <div class="stage" id="stage">
    <canvas id="glow" width="24" height="16" aria-hidden="true"></canvas>
    <div class="screen-box">
      <canvas id="screen" aria-label="게임 화면 240×160"></canvas>
      <!-- The game menu (GBA R: 移動 flowchart, オプション, セーブ) at a finished page; inside the game's own
           screens it turns into a back button (GBA B). Hidden otherwise. -->
      <button type="button" class="menu-button" id="menu" aria-label="게임 메뉴 (S)" title="게임 메뉴 · 이동 · 저장 (S)">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="open"><rect x="3" y="3.5" width="7" height="5" rx="1"/><rect x="14" y="9.5" width="7" height="5" rx="1"/><rect x="3" y="15.5" width="7" height="5" rx="1"/><path d="M10 6h2v12h-2M12 12h2"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="back"><path d="M9 5L4 10l5 5M4 10h10a5 5 0 0 1 0 10h-3"/></svg>
      </button>
    </div>
    <!-- Portrait reading (phones held upright): the picture cut to fill, the page in large type over it. -->
    <div class="reader" id="reader" aria-live="polite">
      <canvas id="picture" aria-hidden="true"></canvas>
      <div class="veil" aria-hidden="true"></div>
      <div class="page"><p class="words" id="words" lang="ja"></p><div class="choices" id="choices" lang="ja"></div></div>
    </div>
    <div class="loading" id="loading" role="status">
      <span class="bar-track"><span></span></span>
      <span>원작 데이터를 불러오는 중</span>
    </div>
  </div>

  <footer class="bar" id="bar">
    <div class="meta">
      <span class="scale" id="scale" title="원본 240×160 화면을 정수 배율로 확대합니다">×1</span>
      <p class="keys" id="keys">
        <span><kbd>Z</kbd> 결정</span>
        <span><kbd>X</kbd> 취소</span>
        <span><kbd>↑</kbd><kbd>↓</kbd> 선택</span>
        <span><kbd>Enter</kbd> START</span>
        <span><kbd>S</kbd> R 메뉴</span>
        <span><kbd>A</kbd> L</span>
      </p>
    </div>
    <div class="controls">
      <button type="button" class="icon" id="mute" aria-pressed="false" aria-label="소리 끄기">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="on"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="off"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
      </button>
      <label class="volume"><span class="sr">음량</span><input id="volume" type="range" min="0" max="100" value="80"></label>
      <span class="sep" aria-hidden="true"></span>
      <!-- Touch screens play by tapping the screen; the console buttons are there for whoever wants them. -->
      <button type="button" class="icon touch-only" id="padtoggle" aria-pressed="false" aria-label="게임 버튼 보이기" title="게임 버튼">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="7" width="19" height="10" rx="5"/><path d="M7.5 10v4M5.5 12h4"/><circle cx="15.5" cy="11" r=".6"/><circle cx="17.5" cy="13" r=".6"/></svg>
      </button>
      <button type="button" class="icon touch-only" id="readertoggle" aria-pressed="true" aria-label="세로 읽기 끄기 (원본 화면)" title="세로 읽기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M9 8h6M9 11h6M9 14h4"/></svg>
      </button>
      <button type="button" class="icon" id="theatre" aria-pressed="false" aria-label="극장 모드 (T)" title="극장 모드 (T)" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="1.5"/></svg>
      </button>
      <button type="button" class="icon" id="fullscreen" aria-label="전체 화면 (F)" title="전체 화면 (F)">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="on"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="off"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
      </button>
    </div>
  </footer>

  <!-- Touch buttons for phones and tablets; keyboard players never see them. -->
  <div class="pad" id="pad" aria-label="게임 버튼">
    <div class="shoulders">
      <button type="button" data-key="L" class="shoulder" aria-label="L">L</button>
      <button type="button" data-key="R" class="shoulder" aria-label="R (메뉴)">R</button>
    </div>
    <div class="dpad">
      <button type="button" data-key="UP" aria-label="위"></button>
      <button type="button" data-key="LEFT" aria-label="왼쪽"></button>
      <span class="hub" aria-hidden="true"></span>
      <button type="button" data-key="RIGHT" aria-label="오른쪽"></button>
      <button type="button" data-key="DOWN" aria-label="아래"></button>
    </div>
    <div class="system">
      <button type="button" data-key="START" class="pill" aria-label="START"></button>
      <span>START</span>
    </div>
    <div class="face">
      <span class="key"><button type="button" data-key="B" class="round">B</button></span>
      <span class="key"><button type="button" data-key="A" class="round primary">A</button></span>
    </div>
  </div>
</main>
<script type="module" src="shell.js"></script>
<script type="module" src="reader.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
