<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>카마이타치의 밤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<link rel="stylesheet" href="shell.css">
</head>
<body>
<main class="shell" id="shell">
  <!-- The cartridge's 256x224 screen, scaled by whole numbers. Only the menu button is laid over it. -->
  <div class="stage" id="stage">
    <canvas id="glow" width="32" height="28" aria-hidden="true"></canvas>
    <div class="screen-box" id="screenbox">
      <canvas id="screen" width="256" height="224" aria-label="게임 화면 256×224"></canvas>
      <button type="button" class="menu-button" id="menu" aria-label="게임 메뉴" aria-expanded="false" title="게임 메뉴">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg>
      </button>
      <div class="sheet" id="sheet" role="menu" hidden>
        <button type="button" role="menuitem" data-b="X">앞 문장 다시 보기</button>
        <button type="button" role="menuitem" data-b="SELECT">글자 숨기기</button>
        <button type="button" role="menuitem" data-b="START">START</button>
        <button type="button" role="menuitem" data-b="B">취소 (B)</button>
      </div>
    </div>
    <div class="loading" id="loading" role="status">
      <span class="bar-track"><span></span></span>
      <span id="loading-text">원작 데이터를 불러오는 중</span>
    </div>
    <button type="button" class="start" id="start" hidden>눌러서 시작</button>
    <p class="error" id="error" hidden></p>
  </div>

  <footer class="bar" id="bar">
    <div class="meta">
      <span class="scale" id="scale" title="원본 256×224 화면을 정수 배율로 확대합니다">×1</span>
      <p class="keys" id="keys">
        <span><kbd>X</kbd> 결정</span>
        <span><kbd>Z</kbd> 취소</span>
        <span><kbd>S</kbd> 앞 문장</span>
        <span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 선택</span>
        <span><kbd>Enter</kbd> START</span>
        <span><kbd>Shift</kbd> 글자 숨기기</span>
      </p>
    </div>
    <div class="controls">
      <button type="button" class="icon" id="mute" aria-pressed="false" aria-label="소리 끄기">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="on"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="off"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
      </button>
      <label class="volume"><span class="sr">음량</span><input id="volume" type="range" min="0" max="100" value="80"></label>
      <span class="sep" aria-hidden="true"></span>
      <button type="button" class="icon" id="fullscreen" aria-label="전체 화면 (F)" title="전체 화면 (F)">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="on"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="off"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
      </button>
    </div>
  </footer>
</main>
<script type="module" src="player.js"></script>
</body>
</html>
