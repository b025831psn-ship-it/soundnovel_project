<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>펜션 슈프르 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@500;700&family=Noto+Serif+JP:wght@500&display=swap">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<header class="top">
  <button id="drawer" class="icon" aria-label="장면 목록" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
  <a class="brand" href="./"><svg viewBox="0 0 24 24"><path d="M4 20V9l8-5 8 5v11"/><path d="M9 20v-6h6v6"/></svg>펜션 슈프르 <span>관리자</span></a>
  <label class="pick"><span>작품</span><select id="title"></select></label>
  <label class="pick"><span>판본</span><select id="edition"></select></label>
  <input id="q" class="field" type="search" placeholder="ID, 일본어, 한글로 찾기" autocomplete="off" spellcheck="false">
</header>
<main class="frame">
  <aside id="side" class="side">
    <div class="side-head">
      <label class="check"><input id="edited" type="checkbox"><span>고친 대사만</span></label>
      <p id="count" class="note"></p>
    </div>
    <ol id="list" class="rows"></ol>
  </aside>
  <section id="stage" class="stage">
    <div class="screen" id="screen">
      <div class="idle" id="idle">
        <p id="idle-text">대사를 고른 뒤 「이 장면으로」를 누르면 게임이 여기에서 그 쪽부터 열립니다.</p>
        <button id="run" class="btn">처음부터 디버그로 실행</button>
      </div>
    </div>
    <div class="now" id="now" hidden><span class="label">지금 화면의 대사</span><div id="now-lines" class="chips"></div></div>
  </section>
  <section id="panel" class="panel">
    <div id="empty" class="blank"><p>왼쪽 목록에서 대사를 고르거나, 게임을 열어 읽는 쪽의 대사를 고르세요.</p></div>
    <div id="edit" hidden>
      <div class="panel-head"><span id="id" class="code"></span><span id="mark" class="badge" hidden></span><span class="grow"></span>
        <button id="prev" class="btn quiet" aria-label="이전 대사">이전</button><button id="next" class="btn quiet" aria-label="다음 대사">다음</button></div>
      <h2>일본어 원문</h2>
      <p id="ja" class="source" lang="ja"></p>
      <h2>한글 <small>화면에 나오는 그대로 고칩니다. 엔터가 줄바꿈입니다.</small></h2>
      <div id="ko" class="editor" contenteditable="true" spellcheck="false" role="textbox" aria-multiline="true"></div>
      <ul id="notes" class="notes"></ul>
      <h2>게임 화면 미리보기</h2>
      <div id="preview" class="preview"></div>
      <div class="actions">
        <span id="status" class="note"></span>
        <button id="revert" class="btn quiet">원래 번역으로</button>
        <button id="jump" class="btn">이 장면으로</button>
        <button id="save" class="btn main">저장</button>
      </div>
    </div>
  </section>
</main>
<script type="module" src="admin.js"></script>
</body>
</html>
