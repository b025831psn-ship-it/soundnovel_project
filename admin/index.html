<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>펜션 슈프르 관리자</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<header>
  <h1>펜션 슈프르 관리자</h1>
  <select id="game" aria-label="작품"></select>
</header>
<main>
  <section id="find">
    <input id="q" type="search" placeholder="ID, 일본어, 한글로 찾기" autocomplete="off" spellcheck="false">
    <label class="only"><input id="edited" type="checkbox"> 고친 대사만</label>
    <p id="count"></p>
    <ol id="list"></ol>
  </section>
  <section id="edit" hidden>
    <div class="bar"><button id="back" class="quiet">목록</button><span id="id"></span><span id="mark"></span></div>
    <h2>일본어 원문</h2>
    <p id="ja"></p>
    <h2>한글 <small>화면에 나오는 그대로 고치세요. 엔터가 줄바꿈입니다. 회색 표시는 지우지 마세요.</small></h2>
    <div id="ko" contenteditable="true" spellcheck="false" role="textbox" aria-multiline="true"></div>
    <ul id="notes"></ul>
    <h2>게임 화면 미리보기</h2>
    <div id="preview"></div>
    <div class="bar end">
      <span id="status"></span>
      <button id="prev" class="quiet">이전</button><button id="next" class="quiet">다음</button>
      <button id="revert" class="quiet">원래 번역으로</button>
      <button id="save" class="main">저장</button>
    </div>
  </section>
</main>
<script type="module" src="admin.js"></script>
</body>
</html>
