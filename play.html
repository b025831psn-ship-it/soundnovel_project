<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GBA 플레이어</title>
<link rel="stylesheet" href="/style.css">
<main class="game-pane">

<header><h1 id="title"></h1><span>GBA</span></header>
<div class="screen"><div id="game"></div></div>
<p id="status" role="status">플레이어를 불러오는 중…</p>
</main>
<script src="/games.js"></script>
<script>
  const game = games.find(item => item.slug === location.pathname.split('/')[2]);
  document.title = document.querySelector('#title').textContent = game.name;
  const statusLine = document.querySelector('#status');
  async function boot() {
    const response = await fetch(game.rom, {method:'HEAD'});
    if (!response.ok) throw new Error('게임 파일을 찾을 수 없습니다. 저장소 바로 위 폴더의 ' + game.rom.slice(1) + ' 파일을 확인해 주세요.');
    Object.assign(window, {
      EJS_player:'#game', EJS_core:'gba', EJS_gameUrl:game.rom,
      EJS_gameName:game.save, EJS_startOnLoaded:true,
      EJS_pathtodata:'https://cdn.emulatorjs.org/stable/data/',
      EJS_onGameStart:() => { statusLine.textContent = '게임 화면을 클릭하면 키보드로 조작할 수 있습니다.'; }
    });
    const loader = document.createElement('script');
    loader.src = window.EJS_pathtodata + 'loader.js';
    loader.onerror = () => { statusLine.textContent = '플레이어 다운로드에 실패했습니다. 인터넷 연결을 확인하고 새로고침해 주세요.'; };
    document.body.append(loader);
  }
  if (window.top === window.self) location.replace("/#" + game.slug);
  else boot().catch(error => { statusLine.textContent = error.message; });
</script>
</html>
