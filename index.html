<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>사운드노벨 · GBA 작품 선택</title>
<link rel="stylesheet" href="/style.css">
<main class="hub">
<header><h1>사운드노벨</h1><span>GAME BOY ADVANCE</span></header>
<div class="workspace"><nav aria-label="작품 선택">
<article>
  <a class="logo" href="#kamaitachi" aria-label="카마이타치의 밤 어드밴스 실행"><img src="/art/kamaitachi.png?logo" alt="かまいたちの夜 ADVANCE"></a>
  <div><h2>카마이타치의 밤 어드밴스 <small>(2002)</small></h2>
  <div class="meta"><span>GBA · 일본어 원작 (한글화 예정)</span>
  <a target="_blank" rel="noopener" href="https://www.spike-chunsoft.co.jp/pages/games/kamagba/">소개</a>
  <a target="_blank" rel="noopener" href="https://78514.com/games/kama/kama_endlist.html">공략</a></div></div>
</article>
<article>
  <a class="logo" href="#higanbana" aria-label="피안화 실행"><img src="/art/higanbana.png?logo" alt="彼岸花"></a>
  <div><h2>피안화 <small>(2002)</small></h2>
  <div class="meta"><span>GBA · 한글 패치 미적용</span>
  <a target="_blank" rel="noopener" href="https://geo-online.co.jp/store_info/item/5032708/">소개</a>
  <a target="_blank" rel="noopener" href="https://www.chinaavg.com/forum.php?mod=viewthread&amp;tid=8789">공략</a></div></div>
</article>
</nav>
<section class="player" aria-label="게임 실행기">
  <p id="prompt">목록에서 작품 로고를 선택해 주세요.</p>
  <iframe hidden title="GBA 실행기" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
</section></div>
<script>
  const links = Array.from(document.querySelectorAll('.logo'));
  const frame = document.querySelector('iframe');
  function showSelection() {
    const selected = links.find(link => link.hash === location.hash);
    for (const link of links) {
      if (link === selected) link.setAttribute('aria-current', 'true');
      else link.removeAttribute('aria-current');
    }
    document.querySelector('#prompt').hidden = Boolean(selected);
    frame.hidden = !selected;
    if (selected) {
      frame.title = selected.getAttribute('aria-label');
      frame.src = selected.hash === '#kamaitachi'
        ? '/ports/kamaitachi-gba/index.html'
        : '/play/' + selected.hash.slice(1) + '/';
    } else {
      frame.removeAttribute('src');
    }
  }
  window.addEventListener('hashchange', showSelection);
  showSelection();
</script>
</main>
</html>
