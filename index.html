<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>사운드노벨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@500;700&family=Noto+Serif+JP:wght@500;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/" aria-label="사운드노벨 처음으로">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18V7l8-3 8 3v11"/><path d="M9 18v-5a3 3 0 0 1 6 0v5"/></svg>
    <span>사운드노벨</span>
  </a>
  <span class="platform">GAME BOY ADVANCE · 원작 엔진 이식</span>
</header>

<main class="hub">
  <section class="theatre" aria-label="게임 실행기">
    <!-- Before a game starts: the selected work's title card. -->
    <div class="marquee" id="marquee">
      <div class="snow" aria-hidden="true"></div>
      <p class="kicker">1994 슈퍼 패미컴 · 2002 게임보이 어드밴스</p>
      <h1 lang="ja">かまいたちの夜<span>ADVANCE</span></h1>
      <p class="ko">카마이타치의 밤 어드밴스</p>
      <p class="lede">폭설로 고립된 펜션, 그날 밤의 이야기. 원작 GBA 엔진을 그대로 옮겨, 같은 화면과 같은 소리로 플레이합니다.</p>
      <a class="start" href="#kamaitachi">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>
        플레이
      </a>
    </div>
    <iframe hidden title="게임 실행기" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
  </section>

  <nav class="library" aria-label="작품 선택">
    <h2 class="label">작품</h2>
    <a class="work" href="#kamaitachi" aria-label="카마이타치의 밤 어드밴스 실행">
      <span class="cover kama">
        <img src="/art/kamaitachi.png?logo" alt="" onerror="this.remove()">
        <span class="cover-text" lang="ja">かまいたちの夜<small>ADVANCE</small></span>
      </span>
      <span class="info">
        <span class="title">카마이타치의 밤 어드밴스</span>
        <span class="sub">2002 · 춘소프트</span>
        <span class="status ready">플레이 가능 · 일본어</span>
      </span>
    </a>
    <a class="work" href="#higanbana" aria-label="피안화 실행">
      <span class="cover higan">
        <img src="/art/higanbana.png?logo" alt="" onerror="this.remove()">
        <span class="cover-text" lang="ja">彼岸花</span>
      </span>
      <span class="info">
        <span class="title">피안화</span>
        <span class="sub">2002</span>
        <span class="status">준비 중</span>
      </span>
    </a>
    <p class="links">
      <a target="_blank" rel="noopener" href="https://www.spike-chunsoft.co.jp/pages/games/kamagba/">카마이타치 소개</a>
      <a target="_blank" rel="noopener" href="https://78514.com/games/kama/kama_endlist.html">공략</a>
    </p>
  </nav>
</main>

<script>
  const links = Array.from(document.querySelectorAll('.work'));
  const frame = document.querySelector('iframe');
  const marquee = document.querySelector('#marquee');
  function showSelection() {
    const selected = links.find(link => link.hash === location.hash);
    for (const link of links) {
      if (link === selected) link.setAttribute('aria-current', 'true');
      else link.removeAttribute('aria-current');
    }
    marquee.hidden = Boolean(selected);
    frame.hidden = !selected;
    document.body.classList.toggle('playing', Boolean(selected));
    if (selected) {
      frame.title = selected.getAttribute('aria-label');
      const src = selected.hash === '#kamaitachi'
        ? '/ports/kamaitachi-gba/index.html'
        : '/play/' + selected.hash.slice(1) + '/';
      if (frame.getAttribute('src') !== src) frame.src = src;
      frame.focus();
    } else {
      frame.removeAttribute('src');
    }
  }
  window.addEventListener('hashchange', showSelection);
  showSelection();
</script>
</body>
</html>
